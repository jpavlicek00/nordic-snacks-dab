bundle:
  name: nordic_snacks_dp

include:
  - resources/jobs/*.yml

variables:
  env:
    default: dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-60e07a8c-18dc.cloud.databricks.com
  test:
    mode: production
    variables:
      env: test
    workspace:
      host: https://dbc-60e07a8c-18dc.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/test
  prod:
    mode: production
    variables:
      env: prod
    workspace:
      host: https://dbc-60e07a8c-18dc.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod